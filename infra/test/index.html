<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="panel">
        <p class="eyebrow">D3 Viewer</p>
        <h1>Contract Knowledge Graph</h1>
        <p class="muted">
          Explore nodes, clause links, obligations, parties, and extracted terms from a contract graph JSON.
        </p>
      </div>

      <div class="panel controls">
        <label class="field">
          <span>JSON path</span>
          <input id="graph-path" type="text" value="../json/knowledge_graph/TomOnlineInc_20060501_20-F_EX-4.46_749700_EX-4.46_Co-Branding_Agreement_knowledge_graph.json">
        </label>

        <div class="actions">
          <button id="load-default" type="button">Load Path</button>
          <label class="file-button" for="file-input">Open File</label>
          <input id="file-input" type="file" accept=".json,application/json">
        </div>

        <label class="field">
          <span>Search nodes</span>
          <input id="search-input" type="search" placeholder="party, clause 5.3.5, obligation...">
        </label>

        <label class="field">
          <span>Charge</span>
          <input id="charge-input" type="range" min="-600" max="-40" step="10" value="-220">
        </label>

        <label class="checkbox">
          <input id="labels-toggle" type="checkbox" checked>
          <span>Show node labels</span>
        </label>
      </div>

      <div class="panel stats">
        <div class="stat-row"><span>Source file</span><strong id="stat-source">-</strong></div>
        <div class="stat-row"><span>Nodes</span><strong id="stat-nodes">0</strong></div>
        <div class="stat-row"><span>Edges</span><strong id="stat-edges">0</strong></div>
        <div class="stat-row"><span>Node types</span><strong id="stat-types">0</strong></div>
      </div>

      <div class="panel legend">
        <div class="panel-header">
          <h2>Types</h2>
        </div>
        <ul id="legend-list"></ul>
      </div>

      <div class="panel details">
        <div class="panel-header">
          <h2>Details</h2>
        </div>
        <div id="details-content" class="details-content">
          <p class="muted">Select a node to inspect its attributes and connected relations.</p>
        </div>
      </div>
    </aside>

    <main class="canvas-wrap">
      <div class="statusbar">
        <span id="status-text">Waiting for graph data.</span>
      </div>
      <svg id="graph-svg" aria-label="Knowledge graph visualization"></svg>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
